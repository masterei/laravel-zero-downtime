name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: my-app

    concurrency:
      group: production
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      - name: Install Dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --ignore-platform-reqs

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Generate Deployment Variables
        run: |
          RELEASE_NAME="$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)"
          ARTIFACT_NAME="${APP_NAME}-${RELEASE_NAME}.tar.gz"
          ARTIFACT_UPLOAD_PATH="/tmp/$ARTIFACT_NAME"

          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_UPLOAD_PATH=$ARTIFACT_UPLOAD_PATH" >> "$GITHUB_ENV"

      - name: Create Archive
        run: |
          shopt -s dotglob

          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=tests \
            --exclude=node_modules \
            --exclude=storage \
            --exclude="$ARTIFACT_NAME" \
            -czf "$ARTIFACT_NAME" \
            *

          shopt -u dotglob

      - name: Upload Archive
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.REMOTE_FINGERPRINT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "${{ env.ARTIFACT_NAME }}"
          target: /tmp

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.REMOTE_FINGERPRINT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            /opt/laravel-zero-downtime/deploy.sh \
              "${{ env.APP_NAME }}" \
              "${{ env.RELEASE_NAME }}" \
              "${{ env.ARTIFACT_UPLOAD_PATH }}"
